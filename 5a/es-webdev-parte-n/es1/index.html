<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="style.css">
	<title>Es1</title>
</head>
<body>
	<h1>Distributore di Caffè</h1>
	<div class="machine-control-region">
		<div>
			<label for="get-coffee" class="machine-label">Utente</label>
			<input type="text" placeholder="Inserisci il codice" id="user-code" required>
		</div>
		<div>
			<input type="button" value="Aggiungi utente" id="add-user" class="machine-button">
			<input type="button" value="Prendi un caffè" id="get-coffee" class="machine-button">
		</div>
		<div id="report" class="machine-label">
			Totali: <span id="total-capsules">0</span>
			<p id="user-consumed-capsules" hidden>Consumate:</p>
		</div>
		<p id="error" class="error" hidden></p>
	</div>
	<div class="machine-control-region">
		<label for="load-capsules-count" class="machine-label">Caricamento capsule</label>
		<div>
			<input type="number" min="0" id="load-capsules-count">
			<input type="button" value="Carica" id="load-capsules" class="machine-button">
		</div>
	</div>
	<script src="main.js" defer></script>
</body>
</html>
