<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Dashboard</title>
</head>
<body>
	<h1>Benvenuto alla dashboard</h1>
	<p>Sessione valida per <span id="counter"></span> secondi</p>
	<button onclick="window.location.href = 'es4.html'">Logout</button>
	<script>
		const counter = document.getElementById('counter');
        let count = 5;

		const counterInterval = setInterval(() => {
            counter.textContent = count;
            count--;
		}, 1000);
		setTimeout(() => {
            clearInterval(counterInterval);
            alert("Sessione scaduta, effettua nuovamente il login");
			window.location.href = "es4.html";
		}, 5000);
	</script>
</body>
</html>
