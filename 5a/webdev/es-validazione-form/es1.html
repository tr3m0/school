<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>es1</title>
</head>
<body>
	<form id="user-data">
		<input type="text" name="name" id="name" placeholder="Nome"> <br>
		<input type="email" name="email" id="email" placeholder="Email"><br>
		<input type="submit" name="submit" value="Invia">
	</form>
	<script>
		const name = document.getElementById("name");
        const email = document.getElementById("email");

        document.getElementById("user-data").addEventListener("submit", (event) => {
            event.preventDefault();
            const testInput = input => {
                if (input.value === "") {
                    input.parentElement.insertBefore(document.createTextNode("Il campo è vuoto"), input.nextSibling);
                    input.parentElement.insertBefore(document.createElement("br"), input.nextSibling);
                    return false;
				}
                return true;
            }

            if (testInput(name) && testInput(email)) {
                event.target.prepend("Dati inviati correttamente", document.createElement("br"));
            }
		});
	</script>
</body>
</html>
