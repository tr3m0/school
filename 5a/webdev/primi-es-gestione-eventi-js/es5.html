<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>es5</title>
</head>
<body>
	<h1>Timer</h1>
	<div id="counter"></div>
	<script defer>
		let countdown = 10;
        const intervalID = setInterval(() => document.getElementById("counter").textContent = String(--countdown), 1000);
		setTimeout(() => {
            alert("Tempo esaurito!");
            clearInterval(intervalID);
        }, countdown * 1000);

	</script>
</body>
</html>
