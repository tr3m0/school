<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>es2</title>
</head>
<body>
    <ul id="todo"></ul>
    <form>
        <input type="text" id="task-name">
        <input type="button" id="add-task" value="Insert">
    </form>
    <script>
        const todo = document.getElementById("todo");
        const taskName = document.getElementById("task-name");
        document.getElementById("add-task").addEventListener("click", () => {
            function createDeleter() {
                const deleter = document.createElement("button");
                deleter.textContent = "Delete";
                deleter.addEventListener("click", () => todo.removeChild(li));
                return deleter;
            }
            const li = document.createElement("li");
            li.appendChild(document.createTextNode(taskName.value));
            li.appendChild(createDeleter());
            todo.appendChild(li);
        });
    </script>
</body>
</html>
